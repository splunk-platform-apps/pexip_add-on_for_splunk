name: Evaluate Splunk App Publication Readiness

on:
  push:
    branches:
      - 'test-readiness-pipeline'
  # pull_request:
  #   branches:
  #     - main
  #   types: [opened, reopened, synchronize]

# Allow only 1 concurrent execution
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  call-workflow:
    uses: splunk-platform-apps/.github/.github/workflows/reusable-build-appinspect-release.yml@dvr-123-add-check-on-navigation
    with:
      caller-repo-name: ${{ github.event.repository.name }}
